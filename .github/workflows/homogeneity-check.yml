name: Homogeneity Check

on:
  push:
  pull_request:

# DE: Nur lesender Checkout; unbenannte Token-Rechte bleiben gesperrt.
# EN: Read-only checkout; unspecified token permissions remain disabled.
permissions:
  contents: read

jobs:
  check:
    name: Agent Secret Scan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      - name: Run Agent Secret Scan (Bash)
        if: runner.os != 'Windows'
        run: bash scripts/scan-agent-secrets.sh --fail-on-high .

      - name: Run Agent Secret Scan (Bash on Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/scan-agent-secrets.sh --fail-on-high .
